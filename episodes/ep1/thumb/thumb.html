<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(anton.woff2)}@font-face{font-family:Archivo;src:url(archivo.woff2)}
*{margin:0;box-sizing:border-box}body{background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden;background:#02040a url(bg-moons.png) 170px -205px/1700px auto no-repeat}
#t:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#02040af2 0%,#02040acc 38%,#02040a00 62%)}
.g{position:absolute;font-family:Anton;line-height:.9;background:linear-gradient(#fff,#ffe066 50%,#ff9500);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 #5a2200) drop-shadow(0 0 24px #000)}
.w{position:absolute;font-family:Anton;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill;line-height:.95}
.tag{position:absolute;left:46px;bottom:52px;font:38px Archivo;color:#fff;background:#ff2d2d;padding:12px 26px;border-radius:16px;border:5px solid #000;transform:rotate(-2deg)}
.arrow{position:absolute;left:640px;top:410px;font:120px Anton;color:#ffd23f;-webkit-text-stroke:10px #000;paint-order:stroke fill;transform:rotate(-12deg)}
</style></head><body><div id="t">
<div class="g" style="left:46px;top:40px;font-size:250px">25</div>
<div class="w" style="left:46px;top:280px;font-size:118px">FACTS THAT</div>
<div class="w" style="left:46px;top:400px;font-size:118px">SOUND <span style="color:#ff3b3b">FAKE</span></div>
<div class="tag">BUT ALL 100% TRUE</div>
</div></body></html>
